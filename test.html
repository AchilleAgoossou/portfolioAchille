
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  (function () {
    emailjs.init({ publicKey: "dUrLjb8AW57c4XUB-" });
  })();
</script>


<!-- ============ FORMULAIRE ============ -->
<form id="contact-form" action="#">

  <div class="form-group">
    <input
      class="form-control"
      type="text"
      name="user_name"
      id="user_name"
      placeholder="Nom *"
      required
    />
  </div>

  <div class="form-group">
    <input
      class="form-control"
      type="email"
      name="user_email"
      id="user_email"
      placeholder="Email *"
      required
    />
  </div>

  <div class="form-group">
    <textarea
      class="form-control"
      name="message"
      id="message"
      placeholder="Message *"
      rows="7"
      required
    ></textarea>
  </div>

  <!-- Zone de feedback (succès / erreur / envoi en cours) -->
  <div id="form-status" class="mb-3" style="display:none;"></div>

  <div class="form-group">
    <button type="submit" id="submit-btn" class="form-control btn btn-primary">
      Envoyer le message
    </button>
  </div>

</form>


<!-- ============ SCRIPT D'ENVOI ============ -->
<script>
  (function () {
    const form = document.getElementById("contact-form");
    const statusBox = document.getElementById("form-status");
    const submitBtn = document.getElementById("submit-btn");

    function showStatus(message, type) {
      statusBox.style.display = "block";
      statusBox.textContent = message;
      statusBox.className =
        "mb-3 alert " + (type === "success" ? "alert-success" : "alert-danger");
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Envoi en cours...";
      statusBox.style.display = "none";

      emailjs
        .sendForm("service_1v9ju3c", "template_atp2mfe", form)
        .then(function () {
          showStatus("Message envoyé avec succès. Merci, je reviens vers vous rapidement.", "success");
          form.reset();
        })
        .catch(function (error) {
          showStatus("Une erreur est survenue. Merci de réessayer ou de m'écrire directement par email.", "error");
          console.error("EmailJS error:", error);
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "Envoyer le message";
        });
    });
  })();
</script>
